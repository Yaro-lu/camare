; camare first-release example: x86-64 host and H.264 camera streams.
; Copy this file to an untracked camare.ini before deployment.
; Put secrets in separate files; never paste a password or token into this INI.

[camare]
instance_id = home-camera
; Complete instance directory imported by 1Panel (not merely a parent folder).
runtime_dir = /opt/1panel/docker/compose/camare-home-camera
timezone = Asia/Shanghai
provider = lan
groups = yard

[public]
; LAN-only mode has no public origin or Cloudflare token.
origin =
loopback_port = 9080
cloudflare_token_file =

[admin]
; LAN-only mode has no Tailscale admin origin or login restriction.
origin =
loopback_port = 9081
tailscale_login =
frigate_bind_ip = 192.168.1.250
frigate_port = 8971

[lan]
bind_ip = 192.168.1.250
port = 8088

[storage]
media = /srv/frigate/media
retention = 14

[hardware]
; Use mode=cpu with empty render_device and va_driver if VAAPI is unavailable.
mode = intel-vaapi
render_device = /dev/dri/renderD128
va_driver = i965

[group:yard]
name = Yard
host = 192.168.1.128
rtsp_user = admin
rtsp_port = 554
password_file = secrets/yard-rtsp-password
record_audio = false
enabled = true
streams = yard_ptz, yard_fixed

[stream:yard:yard_ptz]
name = Yard PTZ
path = /live/101

[stream:yard:yard_fixed]
name = Yard fixed
path = /live/201

; A deployment may declare one additional group with one or two globally unique
; stream IDs. Add its id to camare.groups and define matching group/stream sections.
