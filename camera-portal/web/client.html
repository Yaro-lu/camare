<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080b0d">
  <title>实时画面</title>
  <link rel="icon" href="/assets/mark.svg">
  <link rel="stylesheet" href="/assets/common.css?v=20260811-1">
  <script type="module" src="/assets/client.js?v=20260811-1"></script>
</head>
<body class="viewer">
  <main class="viewer-shell">
    <header class="viewer-head">
      <div class="brand">
        <img src="/assets/mark.svg" alt="">
        <span>实时画面</span>
      </div>
      <div class="live-indicator"><i></i><span id="statusText">连接中</span></div>
    </header>

    <nav id="cameraGroupTabs" class="camera-group-tabs" aria-label="摄像头区域" hidden></nav>

    <section id="liveView" class="live-grid" aria-label="实时摄像头"></section>

    <section id="replayView" class="replay-view" hidden>
      <div id="replayGrid" class="replay-grid" aria-label="录像回看"></div>
      <div class="replay-controls">
        <div class="date-time-fields">
          <label class="date-field">
            <span>日期</span>
            <input id="replayDate" type="date">
          </label>
          <label class="date-field time-field">
            <span>时间（可选）</span>
            <input id="replayTime" type="time" step="1">
          </label>
        </div>
        <div class="timeline-row">
          <div class="timeline-toolbar">
            <span>拖动时间尺</span>
            <div id="timelineLegend" class="timeline-legend" aria-hidden="true"></div>
          </div>
          <div
            id="timelineViewport"
            class="timeline-viewport"
            role="slider"
            tabindex="0"
            aria-label="录像回看时间"
            aria-valuemin="0"
            aria-valuemax="172795"
            aria-valuenow="0"
            aria-valuetext="00:00:00"
          >
            <div id="timelineTrack" class="timeline-track" aria-hidden="true">
              <div id="timelineRuler" class="timeline-ruler"></div>
              <div id="availability" class="availability"></div>
            </div>
            <div class="timeline-cursor" aria-hidden="true">
              <time id="timelineTime">00:00:00</time>
              <i></i>
            </div>
          </div>
          <input id="timeline" class="timeline-value" type="range" min="0" max="172795" step="5" value="0" tabindex="-1" aria-hidden="true">
        </div>
      </div>
    </section>

    <nav class="mode-switch" aria-label="观看模式">
      <button class="active" type="button" data-mode="live">直播</button>
      <button type="button" data-mode="replay">回看</button>
    </nav>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
