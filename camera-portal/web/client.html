<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080b0d">
  <title>实时画面</title>
  <link rel="icon" href="/assets/mark.svg">
  <link rel="stylesheet" href="/assets/common.css?v=20260730-3">
  <script type="module" src="/assets/client.js?v=20260730-8"></script>
</head>
<body class="viewer">
  <main class="viewer-shell">
    <header class="viewer-head">
      <div class="brand">
        <img src="/assets/mark.svg" alt="">
        <span>实时画面</span>
      </div>
      <div class="live-indicator"><i></i><span id="statusText">连接中</span></div>
    </header>

    <section id="liveView" class="live-grid" aria-label="实时摄像头"></section>

    <section id="replayView" class="replay-view" hidden>
      <div id="replayGrid" class="replay-grid" aria-label="录像回看"></div>
      <div class="replay-controls">
        <div class="date-time-fields">
          <label class="date-field">
            <span>日期</span>
            <input id="replayDate" type="date">
          </label>
          <label class="date-field time-field">
            <span>时间（可选）</span>
            <input id="replayTime" type="time" step="1">
          </label>
        </div>
        <div class="timeline-row">
          <time id="timelineTime">00:00</time>
          <div class="timeline-shell">
            <div id="availability" class="availability"></div>
            <input id="timeline" type="range" min="0" max="86399" step="1" value="0" aria-label="回看时间">
          </div>
        </div>
      </div>
    </section>

    <nav class="mode-switch" aria-label="观看模式">
      <button class="active" type="button" data-mode="live">直播</button>
      <button type="button" data-mode="replay">回看</button>
    </nav>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
